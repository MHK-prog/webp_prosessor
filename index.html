<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>تیم‌بندی و پالت‌ساز WebP</title>
  <style>
    :root{--bg:#0b0f14;--card:#121926;--text:#e8eef7;--muted:#9bb0c9;--line:#223045;--btn:#2d6cdf;}
    *{box-sizing:border-box}
    body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto;background:var(--bg);color:var(--text);padding:10px}
    .wrap{max-width:600px;margin:0 auto;padding-bottom:40px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
    h1{font-size:16px;margin:0 0 12px;text-align:center}
    h2{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600}
    .controls{display:flex;flex-direction:column;gap:12px}
    .row-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    input[type="file"]{width:100%;color:var(--muted);padding:8px;background:#0d1420;border:1px solid var(--line);border-radius:10px}
    button{border:0;background:var(--btn);color:white;padding:12px;border-radius:12px;cursor:pointer;font-weight:700;font-size:14px;width:100%}
    button:disabled{opacity:.4;cursor:not-allowed}
    .small{font-size:12px;color:var(--muted)}
    .grid{display:grid;grid-template-columns:1fr;gap:8px}
    .swatch{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#0d1420;cursor:pointer}
    .swatch input[type="checkbox"]{width:22px;height:22px;accent-color:var(--btn)}
    .chip{width:42px;height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.2);flex-shrink:0}
    .meta{display:flex;flex-direction:column;gap:2px;flex-grow:1}
    .code{font-family:monospace;font-size:14px;color:#cfe3ff;font-weight:bold}
    .canvWrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
    canvas{width:100%;height:auto;background:#0a0f18;border:1px dashed var(--line);border-radius:12px}
    .pill{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:#0d1420;color:var(--muted)}
    select,input[type="number"]{background:#121926;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px;font-size:14px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>تیم‌بندی و پالت‌ساز WebP</h1>
    <div class="controls">
      <input id="file" type="file" accept="image/webp,image/png,image/*" />
      
      <div class="row-inputs">
        <label class="pill">
          <span class="small">فاصله تیم (تلورانس)</span>
          <input id="tolerance" type="number" min="5" max="80" value="25" style="width:60px;">
        </label>
        <label class="pill">
          <span class="small">تعداد تیم برتر</span>
          <input id="topN" type="number" min="2" max="25" value="10" style="width:60px;">
        </label>
      </div>

      <div class="pill">
        <span class="small">آستانه آلفا (شفافیت)</span>
        <input id="alpha" type="number" min="0" max="255" value="125" style="width:60px;">
      </div>

      <button id="analyze" disabled>۱. تشکیل تیم‌ها و یافتن نماینده‌ها</button>
      <span id="status" class="small" style="text-align:center;"></span>
    </div>
  </div>

  <div class="card" id="paletteCard" style="display:none;">
    <h2>۲. انتخاب نماینده‌ها برای پالت نهایی</h2>
    <div id="colors" class="grid"></div>
    <div style="margin-top:12px;">
      <button id="process">۳. تبدیل تصویر به پالت انتخابی</button>
    </div>
  </div>

  <div class="card" id="previewCard" style="display:none;">
    <h2>۴. نتیجه نهایی</h2>
    <div class="canvWrap">
      <div>
        <div class="small" style="margin-bottom:4px;text-align:center;">ورودی</div>
        <canvas id="inCanvas"></canvas>
      </div>
      <div>
        <div class="small" style="margin-bottom:4px;text-align:center;">خروجی</div>
        <canvas id="outCanvas"></canvas>
      </div>
    </div>
    <button id="download" style="background:#10b981;">دانلود خروجی WebP</button>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  const fileEl = $("file");
  const analyzeBtn = $("analyze");
  const processBtn = $("process");
  const downloadBtn = $("download");
  const statusEl = $("status");
  const toleranceEl = $("tolerance");
  const alphaEl = $("alpha");
  const topNEl = $("topN");

  const colorsEl = $("colors");
  const paletteCard = $("paletteCard");
  const previewCard = $("previewCard");

  const inCanvas = $("inCanvas");
  const outCanvas = $("outCanvas");
  const inCtx = inCanvas.getContext("2d", { willReadFrequently: true });
  const outCtx = outCanvas.getContext("2d", { willReadFrequently: true });

  let imgData = null;
  let teams = []; // [{ rep: {r,g,b,hex}, totalCount: number, repCount: number }]
  let selectedHex = new Set();
  let outputReady = false;

  const clamp = (n,a,b)=>Math.max(a,Math.min(b,n));
  const setStatus = (t)=> statusEl.textContent = t || "";

  function rgbToHex(r,g,b){
    const h = (x) => x.toString(16).padStart(2,"0");
    return `#${h(r)}${h(g)}${h(b)}`;
  }
  function hexToRgb(hex){
    const m = /^#?([0-9a-f]{6})$/i.exec(hex);
    if(!m) return null;
    const n = parseInt(m[1], 16);
    return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 };
  }

  function drawToCanvas(image){
    const w = image.naturalWidth || image.width;
    const h = image.naturalHeight || image.height;
    inCanvas.width = w; inCanvas.height = h;
    outCanvas.width = w; outCanvas.height = h;
    inCtx.clearRect(0,0,w,h);
    outCtx.clearRect(0,0,w,h);
    inCtx.drawImage(image, 0, 0);
    imgData = inCtx.getImageData(0,0,w,h);
  }

  // تشکیل تیم‌ها با اصل KISS
  function clusterTeams(){
    if(!imgData) return;
    const alphaCutoff = clamp(parseInt(alphaEl.value || "125", 10), 0, 255);
    const tol = clamp(parseInt(toleranceEl.value || "25", 10), 1, 150);
    const tolSq = tol * tol;
    const topN = clamp(parseInt(topNEl.value || "10", 10), 2, 30);

    const data = imgData.data;
    const counts = new Map();

    // ۱. شمارش فرکانس هر رنگ یکتا
    for(let i=0; i<data.length; i+=4){
      if(data[i+3] < alphaCutoff) continue;
      const key = `${data[i]},${data[i+1]},${data[i+2]}`;
      counts.set(key, (counts.get(key) || 0) + 1);
    }

    // مرتب‌سازی از پر تکرارترین به کم‌تکرارترین
    const sortedColors = [...counts.entries()]
      .map(([k, count]) => {
        const [r,g,b] = k.split(",").map(Number);
        return { r, g, b, count, hex: rgbToHex(r,g,b) };
      })
      .sort((a,b) => b.count - a.count);

    // ۲. تشکیل تیم‌ها (اولین رنگ ورودی به هر تیم، نماینده با بیشترین تکرار است)
    const rawTeams = [];

    for(const col of sortedColors){
      let joined = false;
      for(const t of rawTeams){
        const dr = col.r - t.rep.r;
        const dg = col.g - t.rep.g;
        const db = col.b - t.rep.b;
        const distSq = dr*dr + dg*dg + db*db;

        if(distSq <= tolSq){
          t.totalCount += col.count;
          joined = true;
          break;
        }
      }

      if(!joined){
        rawTeams.push({
          rep: col,
          repCount: col.count,
          totalCount: col.count
        });
      }
    }

    // مرتب‌سازی تیم‌ها بر اساس بزرگی کل تیم
    teams = rawTeams.sort((a,b) => b.totalCount - a.totalCount).slice(0, topN);
    selectedHex = new Set(teams.map(t => t.rep.hex));
    renderTeamList();

    paletteCard.style.display = "block";
    previewCard.style.display = "none";
    setStatus(`تعداد ${teams.length} نماینده تیم پیدا شد.`);
  }

  function renderTeamList(){
    colorsEl.innerHTML = "";
    teams.forEach((t, index) => {
      const row = document.createElement("label");
      row.className = "swatch";

      const chk = document.createElement("input");
      chk.type = "checkbox";
      chk.checked = selectedHex.has(t.rep.hex);
      chk.addEventListener("change", () => {
        if(chk.checked) selectedHex.add(t.rep.hex);
        else selectedHex.delete(t.rep.hex);
      });

      const chip = document.createElement("div");
      chip.className = "chip";
      chip.style.background = t.rep.hex;

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML = `
        <div class="code">تیم #${index + 1} : ${t.rep.hex}</div>
        <div class="small">نماینده: ${t.repCount.toLocaleString()} px | کل تیم: ${t.totalCount.toLocaleString()} px</div>
      `;

      row.appendChild(chk);
      row.appendChild(chip);
      row.appendChild(meta);
      colorsEl.appendChild(row);
    });
  }

  function processImage(){
    if(!imgData || selectedHex.size === 0) return;
    const alphaCutoff = clamp(parseInt(alphaEl.value || "125", 10), 0, 255);
    const palette = [...selectedHex].map(hexToRgb).filter(Boolean);

    const w = imgData.width, h = imgData.height;
    const src = imgData.data;
    const out = new Uint8ClampedArray(src.length);

    for(let i=0; i<src.length; i+=4){
      const a = src[i+3];
      if(a < alphaCutoff){
        out[i+3] = 0;
        continue;
      }
      const r = src[i], g = src[i+1], b = src[i+2];
      let best = 0, bestD = Infinity;

      for(let p=0; p<palette.length; p++){
        const pr = palette[p].r, pg = palette[p].g, pb = palette[p].b;
        const d2 = (r-pr)**2 + (g-pg)**2 + (b-pb)**2;
        if(d2 < bestD){ bestD = d2; best = p; }
      }

      const pick = palette[best];
      out[i]=pick.r; out[i+1]=pick.g; out[i+2]=pick.b; out[i+3]=255;
    }

    outCtx.putImageData(new ImageData(out, w, h), 0, 0);
    outputReady = true;
    previewCard.style.display = "block";
    previewCard.scrollIntoView({behavior: "smooth"});
    setStatus(`پردازش تموم شد! (${palette.length} رنگ نماینده اعمال شد)`);
  }

  function downloadWebP(){
    if(!outputReady) return;
    setStatus("در حال فشرده‌سازی WebP...");

    // خروجی WebP بدون افت (Lossless)
    outCanvas.toBlob(blob => {
      if(!blob){
        setStatus("خطا در ایجاد WebP");
        return;
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "team-palette-icon.webp";
      a.click();
      setStatus(`دانلود شد! (${(blob.size/1024).toFixed(1)} KB)`);
    }, "image/webp");
  }

  fileEl.addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    setStatus("در حال بارگذاری فایل...");
    paletteCard.style.display = "none";
    previewCard.style.display = "none";

    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      drawToCanvas(img);
      analyzeBtn.disabled = false;
      setStatus("تصویر آماده است. مرحله ۱ را بزنید.");
      URL.revokeObjectURL(url);
    };
    img.src = url;
  });

  analyzeBtn.addEventListener("click", clusterTeams);
  processBtn.addEventListener("click", processImage);
  downloadBtn.addEventListener("click", downloadWebP);
})();
</script>
</body>
</html>
